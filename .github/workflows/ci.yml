name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  # Optional Node oracle — only on Linux, when the sibling reference tree
  # is not present in this repo alone the differential JSON fixtures still run.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Differential fixtures (embedded JSON)
        run: go test -run 'DifferentialPatterns|DifferentialPartial|DifferentialTricky' -v -count=1
